name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: node --check static/autonomy.js
      - run: node --check browser_probe.mjs
      - run: node --check static/models.js
      - run: node --check static/app.js
      - run: node --check static/executors.js
      - run: node --check static/agents.js
      - run: node --check static/appearance.js
      - run: node --check static/i18n.js
      - run: node --check static/chat.js
      - run: node --check static/chat-mobile.js
      - run: node --check static/mobile-workspace.js
      - run: node --check static/chat-routing.js
      - run: node --check static/phone.js
      - run: node --check static/phone-login.js
      - run: node --test test_phone_login.mjs
      - run: node --test test_group_chat_ui.mjs
      - run: node --check static/context.js
