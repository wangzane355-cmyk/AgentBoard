name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_server.py test_context_sources.py test_group_chat.py test_agent_registry.py test_launch.py
      - run: node --check static/app.js
      - run: node --check static/agents.js
      - run: node --check static/appearance.js
      - run: node --check static/i18n.js
      - run: node --check static/chat.js
      - run: node --check static/context.js
